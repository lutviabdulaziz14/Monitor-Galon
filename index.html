<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard Monitoring Galon - Lantai 1</title>

  <!-- Firebase SDK v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // GANTI DENGAN CONFIG FIREBASE PROYEK ANDA
    const firebaseConfig = {
      apiKey:            "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
      authDomain:        "monitoring-galon-1f269.firebaseapp.com",
      databaseURL:       "https://monitoring-galon-1f269-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "monitoring-galon-1f269",
      storageBucket:     "monitoring-galon-1f269.firebasestorage.app",
      messagingSenderId: "xxxxxxxxxxxx",
      appId:             "1:xxxxxxxxxxxx:web:xxxxxxxxxxxxxxxxxxxxxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const dataRef = ref(db, 'monitoring/loadcell');

    onValue(dataRef, (snapshot) => {
      const data = snapshot.val() || {};

      // Update tampilan
      document.getElementById('lokasi').textContent    = data.nama  || "Lantai 1";
      document.getElementById('berat').textContent     = (data.berat_total || 0).toFixed(0) + " gram";
      document.getElementById('status').textContent    = data.status || "Tidak diketahui";
      document.getElementById('stok').textContent      = data.stok  || 0;

      // Warna status
      const statusEl = document.getElementById('status');
      const statusText = (data.status || "").toLowerCase();
      
      if (statusText.includes("kosong") || statusText === "empty") {
        statusEl.style.color = "#e74c3c";      // merah
        statusEl.style.fontWeight = "bold";
      } else if (statusText.includes("hampir") || statusText === "almost empty") {
        statusEl.style.color = "#f39c12";      // kuning/oranye
      } else {
        statusEl.style.color = "#2ecc71";      // hijau
      }
    });
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin: 20px 0 40px;
      font-size: 2.1rem;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      padding: 24px 28px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .label {
      font-size: 1.1rem;
      opacity: 0.8;
      margin-bottom: 8px;
    }
    .value {
      font-size: 2.8rem;
      font-weight: 700;
      margin: 0;
    }
    .small {
      font-size: 1rem;
      opacity: 0.7;
      margin-top: 6px;
    }
    @media (min-width: 600px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }
      h1 {
        font-size: 2.6rem;
      }
    }
  </style>
</head>
<body>

  <h1>Dashboard Galon - Lantai 1</h1>

  <div class="container">

    <div class="card">
      <div class="label">Lokasi</div>
      <div class="value" id="lokasi">Lantai 1</div>
      <div class="small">Posisi galon saat ini</div>
    </div>

    <div class="card">
      <div class="label">Berat Total</div>
      <div class="value" id="berat">— gram</div>
      <div class="small">Hasil pengukuran load cell</div>
    </div>

    <div class="card">
      <div class="label">Status Galon</div>
      <div class="value" id="status">—</div>
      <div class="small">Kondisi isi galon</div>
    </div>

    <div class="card">
      <div class="label">Stok Galon</div>
      <div class="value" id="stok">—</div>
      <div class="small">Jumlah galon cadangan</div>
    </div>

  </div>

</body>
</html>
