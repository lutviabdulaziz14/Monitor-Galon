<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galon Dashboard - Floor 1</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // ── GANTI DENGAN CONFIG FIREBASE ANDA ──
    const firebaseConfig = {
      apiKey:            "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
      authDomain:        "monitoring-galon-1f269.firebaseapp.com",
      databaseURL:       "https://monitoring-galon-1f269-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "monitoring-galon-1f269",
      storageBucket:     "monitoring-galon-1f269.firebasestorage.app",
      messagingSenderId: "xxxxxxxxxxxx",
      appId:             "1:xxxxxxxxxxxx:web:xxxxxxxxxxxxxxxxxxxxxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const dataRef = ref(db, 'monitoring/loadcell');

    onValue(dataRef, (snapshot) => {
      const data = snapshot.val() || {};

      document.getElementById('location').textContent = data.nama  || "Floor 1";
      document.getElementById('weight').textContent   = (data.berat_total || 0).toFixed(0) + " g";
      document.getElementById('status').textContent   = data.status || "Unknown";
      document.getElementById('stock').textContent    = data.stok  || 0;

      const statusEl = document.getElementById('status');
      const st = (data.status || "").toLowerCase();

      if (st.includes("empty") || st === "kosong" || st === "habis") {
        statusEl.style.color = "#ff4d4d";
      } else if (st.includes("almost") || st.includes("hampir")) {
        statusEl.style.color = "#ffa500";
      } else {
        statusEl.style.color = "#32cd32";
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 1.35rem;
      margin: 8px 0 16px;
      text-align: center;
      color: #58a6ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      flex: 1;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 14px;
      text-align: center;
    }

    .label {
      font-size: 0.78rem;
      color: #8b949e;
      margin-bottom: 4px;
    }

    .value {
      font-size: 1.65rem;
      font-weight: bold;
      margin: 2px 0;
    }

    .status.value {
      font-size: 1.8rem;
      font-weight: 700;
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.2rem;
      }
      .value {
        font-size: 1.45rem;
      }
      .status.value {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <h1>Galon Monitoring – Floor 1</h1>

  <div class="grid">

    <div class="card">
      <div class="label">Location</div>
      <div class="value" id="location">Floor 1</div>
    </div>

    <div class="card">
      <div class="label">Total Weight</div>
      <div class="value" id="weight">— g</div>
    </div>

    <div class="card">
      <div class="label">Status</div>
      <div class="value status" id="status">—</div>
    </div>

    <div class="card">
      <div class="label">Stock</div>
      <div class="value" id="stock">—</div>
    </div>

  </div>

</body>
</html>
