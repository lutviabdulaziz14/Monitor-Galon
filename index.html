<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galon Monitoring Dashboard - Floor 1</title>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    // GANTI DENGAN CONFIG FIREBASE PROYEK ANDA
    const firebaseConfig = {
      apiKey: "AIzaSyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
      authDomain: "monitoring-galon-1f269.firebaseapp.com",
      databaseURL: "https://monitoring-galon-1f269-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "monitoring-galon-1f269",
      storageBucket: "monitoring-galon-1f269.firebasestorage.app",
      messagingSenderId: "xxxxxxxxxxxx",
      appId: "1:xxxxxxxxxxxx:web:xxxxxxxxxxxxxxxxxxxxxx"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, 'monitoring/loadcell');

    onValue(dataRef, (snapshot) => {
      const data = snapshot.val() || {};

      document.getElementById('location').textContent = data.nama || "Floor 1";
      document.getElementById('weight').textContent   = (data.berat_total || 0).toFixed(0) + " g";
      document.getElementById('stock').textContent    = data.stok  || 0;

      const statusText = data.status || "Unknown";
      const statusEl = document.getElementById('status');
      statusEl.textContent = statusText;

      // Reset class dulu
      statusEl.className = "value status";

      if (statusText.toLowerCase().includes("empty") || statusText.toLowerCase() === "kosong" || statusText.toLowerCase() === "habis") {
        statusEl.classList.add("status-empty");
      } else if (statusText.toLowerCase().includes("almost") || statusText.toLowerCase().includes("hampir")) {
        statusEl.classList.add("status-warning");
      } else {
        statusEl.classList.add("status-ok");
      }
    });
  </script>

  <!-- Font Awesome untuk ikon (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--accent);
      margin-bottom: 0.4rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      width: 100%;
      max-width: 1100px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem 1.8rem;
      border: 1px solid rgba(59, 130, 246, 0.12);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4),
                  0 10px 10px -5px rgba(0,0,0,0.3);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .card i {
      font-size: 1.9rem;
      color: var(--accent);
      margin-bottom: 0.9rem;
      opacity: 0.9;
    }

    .label {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .value {
      font-size: 2.4rem;
      font-weight: 700;
      line-height: 1.1;
    }

    .status {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }

    .status-ok    { color: var(--ok);    text-shadow: 0 0 10px rgba(34,197,94,0.4); }
    .status-warning { color: var(--warning); text-shadow: 0 0 10px rgba(245,158,11,0.4); }
    .status-empty  { color: var(--danger);  text-shadow: 0 0 10px rgba(239,68,68,0.5); animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.75; }
    }

    footer {
      margin-top: auto;
      padding: 1.5rem 0;
      font-size: 0.8rem;
      opacity: 0.6;
      text-align: center;
    }

    @media (max-width: 600px) {
      .value { font-size: 2rem; }
      .status { font-size: 1.9rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Galon Monitoring Dashboard</h1>
    <div class="subtitle">Floor 1 • Real-time Water Gallon Monitoring</div>
  </header>

  <div class="grid">

    <div class="card">
      <i class="fas fa-map-marker-alt"></i>
      <div class="label">Location</div>
      <div class="value" id="location">Floor 1</div>
    </div>

    <div class="card">
      <i class="fas fa-weight-hanging"></i>
      <div class="label">Total Weight</div>
      <div class="value" id="weight">— g</div>
    </div>

    <div class="card">
      <i class="fas fa-tachometer-alt"></i>
      <div class="label">Status</div>
      <div class="value status" id="status">—</div>
    </div>

    <div class="card">
      <i class="fas fa-boxes-stacked"></i>
      <div class="label">Remaining Stock</div>
      <div class="value" id="stock">—</div>
    </div>

  </div>

  <footer>
    Monitoring System • Updated real-time via Firebase • 2025
  </footer>

</body>
</html>
