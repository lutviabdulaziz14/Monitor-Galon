<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitoring Galon</title>

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      padding: 20px;
      color: #fff;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 20px;
      border-radius: 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 18px;
    }

    .label {
      font-weight: 600;
    }

    .value {
      font-weight: 700;
    }
  </style>
</head>

<body>
  <h1>📡 Web Dashboard</h1>

  <div id="container" class="wrap"></div>

  <script type="module">
    // ================= FIREBASE CONFIG =================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://monitoring-galon-1f269-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "monitoring-galon-1f269",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const container = document.getElementById("container");
    const rootRef = ref(db, "monitoring");

    function formatNumber(v) {
      return Number(v || 0).toLocaleString("id-ID", {
        maximumFractionDigits: 2
      });
    }

    function createCard(key, d) {
      const nama = d.nama || key;

      const Weight =
        d.berat_total ?? d.berat_gram ?? 0;

      const Volume =
        d.volume_liter !== undefined
          ? formatNumber(d.volume_liter) + " L"
          : "-";

      let Status = "-";
      if (d.status !== undefined) {
        Status = d.status;
      } else if (d.stable !== undefined) {
        Status = d.stable ? "Stabil" : "Tidak Stabil";
      }

      const Stock = d.stok !== undefined ? d.stok : "-";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h2>🏢 ${nama}</h2>
        <div class="item">
          <span class="label">Berat</span>
          <span class="value">${formatNumber(Weight)} gram</span>
        </div>
        <div class="item">
          <span class="label">Volume</span>
          <span class="value">${Volume}</span>
        </div>
        <div class="item">
          <span class="label">Status</span>
          <span class="value">${Status}</span>
        </div>
        <div class="item">
          <span class="label">Stok</span>
          <span class="value">${Stock}</span>
        </div>
      `;

      return card;
    }

    onValue(rootRef, (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = "";

      if (!data) {
        container.innerHTML = "<p>Data tidak tersedia</p>";
        return;
      }

      Object.keys(data)
        .filter(k => k.toLowerCase().includes("loadcell"))
        .sort()
        .forEach(k => {
          container.appendChild(createCard(k, data[k]));
        });
    });
  </script>
</body>
</html>
